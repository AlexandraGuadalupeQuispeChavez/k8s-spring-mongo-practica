---
# ============================================================
# Deployment: MongoDB 7.0 con PVC para persistencia de datos
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: practica-s11
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongo
          # Inyección de credenciales desde el Secret db-secret
          envFrom:
            - secretRef:
                name: db-secret
          # Montaje del PVC en la ruta estándar de datos de MongoDB
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
---
# ============================================================
# Service: mongo-service (ClusterIP - solo acceso interno)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s11
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
