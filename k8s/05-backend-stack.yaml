---
# ============================================================
# Deployment: Backend Spring WebFlux
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s11
  labels:
    app: backend-webflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-webflux
  template:
    metadata:
      labels:
        app: backend-webflux
    spec:
      containers:
        - name: backend-webflux
          image: backend-webflux:1.0
          # IfNotPresent: usa la imagen local construida con Docker
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # Inyección simultánea de ConfigMap y Secret como variables de entorno
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Sonda de liveness: reinicia el contenedor si falla
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Sonda de readiness: controla si recibe tráfico
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# ============================================================
# Service: backend-service (NodePort - acceso externo en 30080)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
  labels:
    app: backend-webflux
spec:
  type: NodePort
  selector:
    app: backend-webflux
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
