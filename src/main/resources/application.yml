server:
  # Puerto dinámico: usa la variable de entorno APP_PORT o 8080 por defecto
  port: ${APP_PORT:8080}

spring:
  application:
    name: backend-webflux

  data:
    mongodb:
      # URI dinámica construida con variables inyectadas desde ConfigMap y Secret
      # Formato: mongodb://usuario:password@host:puerto/basedatos?authSource=admin
      uri: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${DB_HOST:mongo-service}:${DB_PORT:27017}/${DB_NAME:practica_db}?authSource=admin"

management:
  endpoints:
    web:
      exposure:
        # Expone todos los endpoints de actuator (health, info, metrics, etc.)
        include: "*"
  endpoint:
    health:
      # Habilita las sondas de salud de Kubernetes (liveness y readiness)
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.practica: DEBUG
    org.springframework.data.mongodb: INFO
